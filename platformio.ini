; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; TFT_eSPI normally picks its pin/driver config from one of its own
; bundled User_Setup files. USER_SETUP_LOADED=1 tells the library
; "don't use your own config, one is being supplied externally", and
; -include forces our include/User_Setup.h into every translation unit
; (including TFT_eSPI's own .cpp files) before TFT_eSPI.h is parsed, so
; its pin/driver #defines are already in scope.
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h

; --- Tests (test/) ---
; These are on-device (hardware-in-the-loop) tests, not native/mocked
; unit tests: `pio test` builds each test/<dir> as its own firmware,
; uploads it to the real ESP32 + ILI9341/XPT2046 board, and reads
; Unity's PASS/FAIL output back over serial.
;
; PlatformIO does NOT compile src/ into test binaries by default (only
; test/ + lib/), so the placeholder setup()/loop() in src/main.cpp does
; not collide with each test's own setup()/loop(). No test_build_src
; override is needed.
;
; Run everything:   pio test -e esp32doit-devkit-v1
; Run one suite:    pio test -e esp32doit-devkit-v1 -f test_display_init
; List suites:      pio test -e esp32doit-devkit-v1 --list-tests
